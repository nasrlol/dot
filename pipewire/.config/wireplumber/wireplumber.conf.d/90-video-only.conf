# PipeWire runs only for screencasting (niri -> xdg-desktop-portal-gnome);
# PulseAudio owns the sound cards, so keep wireplumber off ALSA and bluetooth.
wireplumber.profiles = {
  main = {
    monitor.alsa = disabled
    monitor.alsa-midi = disabled
    monitor.bluez = disabled
    monitor.bluez.midi = disabled
  }
}
