# Matches foot (foot/.config/foot/foot.ini): same font, padding, cursor,
# no decorations, and colors from theme/palette-{dark,light} via colors.toml.

[general]
import = ["~/.config/alacritty/colors.toml"]

[window]
opacity = 1.0
blur = false
decorations = "None"
# foot: pad=20x20 center-when-maximized-and-fullscreen
padding = { x = 20, y = 20 }
dynamic_padding = true
title = "alacritty"
dynamic_title = true
option_as_alt = "OnlyRight"

[font]
normal = { family = "LiterationMono Nerd Font Mono" }
size = 15.0

[cursor]
style = { shape = "Block", blinking = "On" }
vi_mode_style = { shape = "Block", blinking = "On" }
blink_interval = 500
blink_timeout = 0
unfocused_hollow = true

[scrolling]
history = 20000
multiplier = 3

[mouse]
hide_when_typing = true

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
