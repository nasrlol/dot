# Matches foot (foot/.config/foot/foot.ini): same font, padding, cursor,
# no decorations, and colors from theme/palette-{dark,light} via colors.toml.
# Imports load first and this file overrides them, so font.size is only set
# in hosts/<host>.toml (linked as host.toml by ./install).
[general]
import = ["~/.config/alacritty/colors.toml", "~/.config/alacritty/host.toml"]

[window]
opacity = 1.0
blur = false
decorations = "None"
# foot: pad=20x20 center-when-maximized-and-fullscreen
padding = { x = 20, y = 20 }
dynamic_padding = true
title = "alacritty"
dynamic_title = true
option_as_alt = "OnlyRight"

[font.normal]
family = "Liberation Mono"
style = "Regular"

[font.bold]
family = "Liberation Mono"
style = "Regular"

[font.italic]
family = "Liberation Mono"
style = "Regular"

[font.bold_italic]
family = "Liberation Mono"
style = "Regular"

[font.offset]
x = 0
y = 1

[cursor]
style = { shape = "Block", blinking = "On" }
vi_mode_style = { shape = "Block", blinking = "On" }
blink_interval = 500
blink_timeout = 0
unfocused_hollow = true

[scrolling]
history = 20000
multiplier = 3

[mouse]
hide_when_typing = true

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
