# Imports load first and this file overrides them, so font.size is only set
# in hosts/<host>.toml (linked as host.toml by ./install).
[general]
import = ["~/.config/alacritty/colors.toml", "~/.config/alacritty/host.toml"]

[window]
opacity = 1.0
dynamic_padding = true
blur = false

[window.padding]
x = 2
y = 2

[font.normal]
family = "Liberation Mono"
style = "Regular"

[font.bold]
family = "Liberation Mono"
style = "Regular"

[font.italic]
family = "Liberation Mono"
style = "Regular"

[font.bold_italic]
family = "Liberation Mono"
style = "Regular"

[font.offset]
x = 0
y = 1

[cursor]
style = { shape = "Block", blinking = "Never" }
thickness = 0.2
unfocused_hollow = true
vi_mode_style = { shape = "Block", blinking = "Never" }

[colors]
draw_bold_text_with_bright_colors = true

[scrolling]
history = 20000
multiplier = 3

[mouse]
hide_when_typing = true

[debug]
render_timer = false

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
