COMMON_FLAGS="-O2 -pipe -mcpu=apple-m2"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# WARNING: Changing your CHOST is not something that should be done lightly.
# Please consult https://wiki.gentoo.org/wiki/Changing_the_CHOST_variable before changing.
CHOST="aarch64-unknown-linux-gnu"

CPU_FLAGS_ARM="aes asimd asimddp asimdfhm asimdhp crc32 edsp i8mm neon sha1 sha2 thumb thumb2 v4 v5 v6 v7 v8 vfp vfpv3 vfpv4 vfp-d32"

VIDEO_CARDS="asahi"
USE="${USE} dbus networkmanager pipewire vulkan wayland -systemd"

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LC_MESSAGES=C.UTF-8

MAKEOPTS="-j8 -l6"
ACCEPT_KEYWORDS="~arm64"
FEATURES="clean-logs"
