backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;
glx-no-rebind-pixmap = true;
use-damage = true;

# Shadows
shadow = true;
shadow-radius = 18;
shadow-offset-x = -18;
shadow-offset-y = -18;
shadow-opacity = 0.6;
shadow-ignore-shaped = false;
shadow-exclude = [
  "_GTK_FRAME_EXTENTS@:c",
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "name = 'dwm'",
  "class_g = 'dwm'",
  "override_redirect = true",
  "class_g = 'slop'"
];

# Opacity
inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 0.9;
inactive-opacity-override = false;

# Corners
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "name = 'dwm'",
  "class_g = 'dwm'"
];

# Blur
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 5;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'utility'",
  "name = 'dwm'",
  "class_g = 'dwm'",
  "class_g = 'slop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Fading
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;
fade-exclude = [];

# General
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
refresh-rate = 60;
vsync = true;
detect-transient = true;
detect-client-leader = true;

focus-exclude = [
  "class_g = 'Cairo-clock'",
  "class_g = 'slop'"
];

# Window type settings
wintypes:
{
  dock = { shadow = false; opacity = 1.0; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; shadow = true; };
  dropdown_menu = { opacity = 0.95; shadow = true; };
  tooltip = { fade = true; shadow = true; opacity = 0.9; focus = true; };
};

# Logging
log-level = "warn";
