theme = { light = "nasr-light", dark = "nasr" }

# Halloy config — docs: https://halloy.chat

[font]
family = "Comic Mono"
size = 20

[servers.liberachat]
nickname = "nasr"
server = "irc.libera.chat"
port = 6697
use_tls = true
# Libera drops the connection (silently) if several WHO replies are
# requested at once after joining big channels; send them one at a time.
who_poll_in_flight_limit = 1
channels = [
    "#halloy",
    "#gentoo",
    "#linux",
    "#emacs",
    "##rust",
    "#c",
    "#haskell",
    "#openbsd",
    "#freebsd-irc",
]

[servers.oftc]
nickname = "nasr"
server = "irc.oftc.net"
port = 6697
use_tls = true
channels = [
    "#asahi",
    "#asahi-alt",
    "#kernelnewbies",
    "#wayland",
]
