# Which workspace each installed app opens on, by its .desktop Categories.
# gen-window-rules reads this plus every .desktop file and writes
# window-rules.kdl (included from config.kdl). Run it after installing apps;
# niri also runs it at startup and reloads the result live.

# Category -> workspace. Checked top to bottom, first matching category wins,
# so the specific ones (Debugger) sit above the broad ones (Development).
# Apps with no matching category open wherever you are.
[categories]
# settings dialogs (pavucontrol, lxappearance) open wherever you are
Settings = none
Debugger = debugger
Profiling = debugger
TerminalEmulator = term
WebBrowser = web
AudioVideo = media
InstantMessaging = media
IRCClient = media
Development = dev
IDE = dev
TextEditor = dev

# Per-app overrides, keyed by .desktop file name (without .desktop).
#   <app> = <workspace> [app-id=<regex>] [title=<regex>]
#   <app> = none          never give it a workspace
# app-id/title are extra matches for apps whose window doesn't report the
# desktop name, exec name or StartupWMClass (those are matched automatically).
[apps]
# Categories is just Development
seergdb = debugger
# window app-id is "tracy"
tracy-profiler = debugger app-id=^tracy$
# X11 with no WM_CLASS: only the title identifies it
gf2 = debugger title=^gf2$
# match the main window title so Picture-in-Picture isn't pulled to "web"
firefox-bin = web title=Mozilla Firefox$
vlc = media app-id=^org\.videolan\.vlc$
# no Categories in its .desktop file
clion = dev app-id=^jetbrains-clion$
# Utility;TextEditor but it's the Neovim GUI
neovide = dev
# plain terminal vim: it opens inside the terminal, not as its own window
vim = none
