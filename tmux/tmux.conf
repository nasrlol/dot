# ==============================================================================
# TERMINAL & SYSTEM SETTINGS
# ==============================================================================
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"

set -g default-shell /usr/bin/zsh
set -g history-limit 50000
set -g focus-events on
set -s escape-time 0
set -g display-time 2000
set -g set-clipboard on
set -g mouse off

# Fix for vim-tmux-navigator (if C-l is used to clear screen)
bind C-l send-keys 'C-l'

# ==============================================================================
# WINDOW & PANE MANAGEMENT
# ==============================================================================
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
setw -g aggressive-resize on
set -g main-pane-width 110

# Prefix: Alt-a
unbind C-b
set -g prefix M-a
bind M-a send-prefix

# Navigation (Alt + hjkl)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Window selection (Alt + 1-6)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6

# Splits/New Window (preserves path)
bind -n M-$ split-window -h -c "#{pane_current_path}"
bind -n M-% split-window -v -c "#{pane_current_path}"
bind -n M-c new-window -c "#{pane_current_path}"
bind -n M-z resize-pane -Z

# Directory-specific splits (manual)
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Resizing
bind -r < resize-pane -L 10
bind -r > resize-pane -R 10
bind -r + resize-pane -D 10
bind -r - resize-pane -U 10

# Window Movement/Swapping
bind -n F11 previous-window
bind -n F12 next-window
bind -n C-S-Left swap-window -d -t -1
bind -n C-S-Right swap-window -d -t +1

# ==============================================================================
# COPY MODE (VI STYLE)
# ==============================================================================
set -g mode-keys vi
set -g status-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X begin-selection \; send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xsel --clipboard"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xsel --clipboard"

# ==============================================================================
# APPEARANCE & STATUS BAR
# ==============================================================================
set -g status on
set -g status-interval 2
set -g status-position top
set -g status-justify centre  # Kept centered as per your override

# Colors
set -g status-style bg=default,fg=white
set -g status-left '#[fg=yellow,bold]#S '
set -g status-right '#[fg=yellow]%d.%m. %H:%M'
set -g status-left-length 20
set -g status-right-length 20

# Window Tabs
set -g window-status-format "#I:#W"
set -g window-status-current-format "#[fg=yellow,bold](#I:#W)"
set -g window-status-separator "  "

# Pane borders
set -g pane-border-status off
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour113

# Message Bar
set -g message-style bg=colour113,fg=black,bold

# ==============================================================================
# SESSION & POPUPS
# ==============================================================================
bind m choose-tree
bind k choose-session
bind N new-session
bind S command-prompt 'rename-session %%'
bind B command-prompt -p "New session name:" \
  "new-session -d -s '%%'; move-window -t '%%:'; switch-client -t '%%'"

# Popups
set -g popup-border-lines rounded

bind C-j display-popup -h 40% -w 40% -E "tmux-session-switcher"
bind C-o display-popup -E "tmux-zoxide-window"
bind C-t display-popup -E "tmux-bro"

bind C-f display-popup -h 70% -w 70% -E "tmux-file-picker"
bind C-r display-popup -h 70% -w 70% -E "tmux-file-picker -d"
bind C-g display-popup -h 70% -w 70% -E "tmux-file-picker -g"
bind C-d display-popup -h 70% -w 70% -E "tmux-file-picker --zoxide --dir-only"
bind C-z display-popup -h 70% -w 70% -E "tmux-file-picker --zoxide"

bind C-p display-popup -h 80% -w 80% -E "tmux-snaglord"

# ==============================================================================
# UTILITY
# ==============================================================================
bind M-s set-window-option synchronize-panes
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config Reloaded!"

# ==============================================================================
# PLUGINS (via TPM)
# ==============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-logging'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Run TPM
run '~/.tmux/plugins/tpm/tpm'
