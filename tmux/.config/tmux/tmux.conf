# Keys follow the same grammar as nvim, emacs and 4coder (4coder_byp):
#   M-v / M-h split, M-q close, M-p switch, M-o open, M-z run, C-hjkl move.
# "Editor-aware" keys go to the editor when nvim/vim/emacs -nw has the pane
# (tmux-pane-is-editor decides) and do the tmux equivalent in a shell pane.
# Prefix + the same letter always does the tmux version.

# TERMINAL & SYSTEM SETTINGS
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",xterm-ghostty:extkeys"

set -g default-shell /usr/bin/fish

set -g history-limit 50000

set -g focus-events on

set -s escape-time 0
set -g display-time 2000

set -g set-clipboard on
set -s copy-command "wl-copy"
set -g mouse on

# CSI u so nvim sees C-Tab, C-S-s, etc. through tmux
set -s extended-keys on
set -s extended-keys-format csi-u

# image protocols for nvim/yazi
set -g allow-passthrough on

# WINDOW & PANE MANAGEMENT
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
setw -g aggressive-resize on
set -g main-pane-width 110

# Prefix: Alt-a. niri uses Super as its modifier, so all Alt binds are free.
# (This shadows nvim's M-a diagnostics inside tmux.)
unbind C-b
set -g prefix M-a
bind M-a send-prefix

# PANE NAVIGATION: C-hjkl, crossing nvim splits (vim-tmux-navigator, below)
set -g @vim_navigator_pattern '(\S+/)?g?\.?(view|l?n?vim?x?|fzf|emacs(client)?)(diff)?(-wrapped)?'
set -g @vim_navigator_mapping_prev ''

# EDITOR-AWARE KEYS (4coder: M-v vsplit, M-h hsplit, M-q close panel,
# M-p switch buffer, M-o open file, M-z execute cli)
bind -n M-v if-shell "tmux-pane-is-editor '#{pane_tty}'" "send-keys M-v" "split-window -h -c '#{pane_current_path}'"
bind -n M-h if-shell "tmux-pane-is-editor '#{pane_tty}'" "send-keys M-h" "split-window -v -c '#{pane_current_path}'"
bind -n M-q if-shell "tmux-pane-is-editor '#{pane_tty}'" "send-keys M-q" "confirm-before -p 'kill pane? (y/n)' kill-pane"
bind -n M-p if-shell "tmux-pane-is-editor '#{pane_tty}'" "send-keys M-p" "display-popup -h 50% -w 60% -E tmux-session-switcher"
bind -n M-o if-shell "tmux-pane-is-editor '#{pane_tty}'" "send-keys M-o" "display-popup -h 50% -w 60% -E tmux-zoxide-window"
bind -n M-z if-shell "tmux-pane-is-editor '#{pane_tty}'" "send-keys M-z" "run -b 'tmux-scratch #{q:client_name} #{q:session_name} #{q:pane_current_path}'"

bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
bind q confirm-before -p "kill pane? (y/n)" kill-pane
bind p display-popup -h 50% -w 60% -E "tmux-session-switcher"
bind o display-popup -h 50% -w 60% -E "tmux-zoxide-window"
bind z run -b "tmux-scratch #{q:client_name} #{q:session_name} #{q:pane_current_path}"

# WINDOWS (prefix 0-9 select windows by default)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-c new-window -c "#{pane_current_path}"
bind c      new-window -c "#{pane_current_path}"

# quick swap, like C-Tab between buffers
bind -n M-Tab last-window
bind -n M-`   switch-client -l

# zoom (4coder M-Return peeks)
bind -n M-Enter resize-pane -Z
bind Enter      resize-pane -Z

bind -n F11 previous-window
bind -n F12 next-window
bind -n C-S-Left  swap-window -d -t -1
bind -n C-S-Right swap-window -d -t +1

# RESIZING
bind -r < resize-pane -L 10
bind -r > resize-pane -R 10
bind -r + resize-pane -D 10
bind -r - resize-pane -U 10

# COPY MODE (VI STYLE)
set -g mode-keys vi
set -g status-keys vi
bind -T copy-mode-vi v     send -X begin-selection
bind -T copy-mode-vi C-v   send -X begin-selection \; send -X rectangle-toggle
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel

# APPEARANCE & STATUS BAR
set -g status on
set -g status-interval 2
set -g status-position top
set -g status-justify centre

source-file ~/.config/tmux/colors.conf
set -g status-left-length           30
set -g status-right-length          20
set -g window-status-separator      "  "

# SESSIONS & POPUPS
bind m choose-tree
bind N new-session
bind S command-prompt 'rename-session %%'
bind B command-prompt -p "New session name:" \
    "new-session -d -s '%%'; move-window -t '%%:'; switch-client -t '%%'"

set -g popup-border-lines rounded

bind g display-popup -h 90% -w 90% -d "#{pane_current_path}" -E "lazygit"

bind M-s set-window-option synchronize-panes

# extrakto: fuzzy-pick text on screen (4coder M-f lists locations)
set -g @extrakto_key 'f'
set -g @extrakto_clip_tool 'wl-copy'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g @resurrect-capture-pane-contents 'on'

# reloading tmux
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config Reloaded!"

# tmux plugins (TPM installs into ~/.local/share/tmux/plugins, outside the repo)
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'

run '~/.local/share/tmux/plugins/tpm/tpm'
