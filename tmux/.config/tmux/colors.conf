# Generated from colors.conf.tmpl by theme/gen. Do not edit colors.conf.
set -g status-style                 bg=#c4a882,fg=#8b7355
set -g status-left                  '#{?client_prefix,#[bg=#c84820#,fg=#111111#,bold] PREFIX #[default] ,}#[fg=#111111,bold]#S#[nobold] - '
# right: pane directory, git branch + CI status (tmux-git-status), clock
set -g status-right                 '#[fg=#111111]#{s|^/home/[^/]+|~|;=/-40/…:pane_current_path}#(tmux-git-status "#{pane_current_path}" "fg=#111111" "fg=#111111" "bg=#c84820,fg=#111111,bold")#[fg=#111111]  %d.%m. %H:%M'
# windows: a rust badge with the exit code when the last command in the
# window's active pane failed (@last_status, set by fish conf.d/tmux.fish)
set -g window-status-format         "#[fg=#111111]#I:#W#{?#{&&:#{@last_status},#{!=:#{@last_status},0}}, #[bg=#c84820#,bold] #{@last_status} #[default],}"
set -g window-status-current-format "#[fg=#111111,bold](#I:#W#{?window_zoomed_flag, Z,})#{?#{&&:#{@last_status},#{!=:#{@last_status},0}}, #[bg=#c84820] #{@last_status} #[default],}"
set -g pane-border-style            fg=#241a10
set -g pane-active-border-style     fg=#3d2b1a
set -g mode-style                   bg=#3d2b1a,fg=#c4a882
set -g message-style                bg=#c84820,fg=#111111,bold
set -g message-command-style        bg=#1f1610,fg=#d48b30
set -g popup-border-style           fg=#3d2b1a
set -g popup-style                  bg=#111111
