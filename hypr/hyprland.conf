# ===============================
# MONITOR
# ===============================
monitor=,preferred,auto,auto

# ===============================
# PROGRAMS
# ===============================
$terminal = alacritty
$menu = wofi --show drun
$neovide = neovide
$emacs = emacs

# ===============================
# AUTOSTART
# ===============================
exec-once = nm-applet
exec-once = waybar
exec-once = hyprpaper

env = XCURSOR_SIZE,12
env = HYPRCURSOR_SIZE,12

# ===============================
# LOOK AND FEEL (DWM STYLE)
# ===============================
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1
    col.active_border = rgba(ffffffff)
    col.inactive_border = rgba(444444ff)
    resize_on_border = false
    allow_tearing = true
    layout = master
}

decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

animations {
    enabled = no
}

master {
    new_status = master
    mfact = 0.55
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = -1
    vfr = true
}

render {
    explicit_sync = 0
    direct_scanout = true
}

# ===============================
# INPUT
# ===============================
input {
    kb_layout = us
    repeat_rate = 50
    repeat_delay = 200
    follow_mouse = 0
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

gestures {
    workspace_swipe = false
}

# ===============================
# WINDOW RULES
# ===============================
# Neovide always workspace 1 fullscreen (monocle)
windowrulev2 = workspace 1, class:^(neovide)$
windowrulev2 = fullscreen, class:^(neovide)$

# Floating terminal
windowrulev2 = float,class:^(Alacritty)$
windowrulev2 = size 900 600,class:^(Alacritty)$
windowrulev2 = center,class:^(Alacritty)$

# Ignore maximize requests
windowrulev2 = suppressevent maximize, class:.*

# Fix XWayland dragging issues
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# ===============================
# KEYBINDINGS
# ===============================
$mainMod = SUPER

# Launch programs
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, N, exec, $neovide
bind = $mainMod, E, exec, $emacs
bind = $mainMod, P, exec, $menu

# Window management
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, Q, exit
bind = $mainMod, V, togglefloating
bind = $mainMod, T, pseudo
bind = $mainMod, SPACE, togglesplit

# Focus movement (vim keys)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Resize windows
bind = $mainMod CTRL, left, resizeactive, -40 0
bind = $mainMod CTRL, right, resizeactive, 40 0
bind = $mainMod CTRL, up, resizeactive, 0 -40
bind = $mainMod CTRL, down, resizeactive, 0 40

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Mouse workspace switch
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media keys
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
