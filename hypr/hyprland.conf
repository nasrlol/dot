monitor=DP-1,2560x1440@60,0x0,1
monitor=eDP-1,1920x1080@60,2560x0,1
monitor=HDMI-A-2,1920x1080@60,4480x0,1

$terminal = alacritty
$menu     = wofi -i --show run
$editor   = neovide
$browser  = brave
$coder    = coder

exec-once = waybar
exec-once = hyprpaper
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY

env = XCURSOR_SIZE,15
env = HYPRCURSOR_SIZE,8
env = HYPRLAND_NO_SD_NOTIFY,1

general {
    gaps_in  = 0
    gaps_out = 0
    border_size = 1

    # Warm palette — active: amber glow, inactive: near-invisible dark
    # rgba() in Hyprland is 0xRRGGBBAA
    col.active_border   = rgba(D48B30ff) rgba(C84820ff) 45deg
    col.inactive_border = rgba(1F1610ff)

    resize_on_border = false
    allow_tearing    = true
    layout           = scroll

    snap {
        enabled     = true
        monitor_gap = 5
        window_gap  = 5
    }
}

decoration {
    rounding         = 0
    active_opacity   = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
    }

    blur {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = fast,      0.05, 0.9,  0.1,  1.05
    bezier = smoothOut, 0.36, 0,    0.66, -0.56
    bezier = smoothIn,  0.25, 1,    0.5,  1
    animation = windows,     1, 3, fast,      popin
    animation = windowsIn,   1, 3, fast,      popin
    animation = windowsOut,  1, 3, fast,      popin
    animation = windowsMove, 1, 3, fast
    animation = workspaces,  1, 3, fast,      slidevert
    animation = fadeIn,      1, 2, smoothIn
    animation = fadeOut,     1, 2, smoothOut
    animation = fade,        1, 2, smoothOut
    animation = layers,      1, 2, smoothOut
}

master {
    new_status      = master
    mfact           = 0.55
    allow_small_split = false
    new_on_top      = true
}

misc {
    disable_hyprland_logo  = true
    force_default_wallpaper = -1
    vrr                    = 0
    mouse_move_focuses_monitor = true
    disable_splash_rendering = true
}

render {
    direct_scanout = false
}

input {
    kb_layout  = us
    kb_options = altwin:alt_super_win,caps:escape,lv3:ralt_switch
    repeat_rate  = 50
    repeat_delay = 140
    follow_mouse = 0
    sensitivity  = 0

    touchpad {
        natural_scroll = true
        tap-to-click   = true
        drag_lock      = false
    }
}

$mainMod = Super

# APPS
bind = $mainMod,       Return, exec, $terminal
bind = $mainMod,       N,      exec, $editor
bind = $mainMod,       E,      exec, emacs
bind = $mainMod,       P,      exec, $menu
bind = $mainMod,       C,      exec, $coder
bind = $mainMod,       B,      exec, $browser

# WINDOW MANAGEMENT
bind = $mainMod,       Q,      killactive
bind = $mainMod SHIFT, Q,      exit
bind = $mainMod,       V,      togglefloating
bind = $mainMod,       T,      pseudo
bind = $mainMod,       F,      fullscreen,   0
bind = $mainMod SHIFT, F,      fullscreen,   1

# FOCUS — arrow keys + hjkl
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d
bind = $mainMod, h,     movefocus, l
bind = $mainMod, j,     movefocus, d
bind = $mainMod, k,     movefocus, u
bind = $mainMod, l,     movefocus, r

# MOVE WINDOW
bind = $mainMod CTRL, left,  movewindow, l
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, up,    movewindow, u
bind = $mainMod CTRL, down,  movewindow, d

# RESIZE
bind = $mainMod SHIFT, left,  resizeactive, -40 0
bind = $mainMod SHIFT, right, resizeactive,  40 0
bind = $mainMod SHIFT, up,    resizeactive,  0 -40
bind = $mainMod SHIFT, down,  resizeactive,  0  40

# MASTER FACTOR
bind = $mainMod, plus,  exec, hyprctl keyword master:mfact +0.05
bind = $mainMod, minus, exec, hyprctl keyword master:mfact -0.05

# WORKSPACES 1-10
bind = $mainMod,       1, workspace,        1
bind = $mainMod,       2, workspace,        2
bind = $mainMod,       3, workspace,        3
bind = $mainMod,       4, workspace,        4
bind = $mainMod,       5, workspace,        5
bind = $mainMod,       6, workspace,        6
bind = $mainMod,       7, workspace,        7
bind = $mainMod,       8, workspace,        8
bind = $mainMod,       9, workspace,        9
bind = $mainMod,       0, workspace,        10
bind = $mainMod SHIFT, 1, movetoworkspace,  1
bind = $mainMod SHIFT, 2, movetoworkspace,  2
bind = $mainMod SHIFT, 3, movetoworkspace,  3
bind = $mainMod SHIFT, 4, movetoworkspace,  4
bind = $mainMod SHIFT, 5, movetoworkspace,  5
bind = $mainMod SHIFT, 6, movetoworkspace,  6
bind = $mainMod SHIFT, 7, movetoworkspace,  7
bind = $mainMod SHIFT, 8, movetoworkspace,  8
bind = $mainMod SHIFT, 9, movetoworkspace,  9
bind = $mainMod SHIFT, 0, movetoworkspace,  10

# SPECIAL WORKSPACE
bind = $mainMod,       S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace,        special:magic

# SCROLL WORKSPACES
bind  = $mainMod, mouse_down, workspace, e+1
bind  = $mainMod, mouse_up,   workspace, e-1

# MOUSE WINDOW OPS
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# MEDIA & BRIGHTNESS
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,         exec, wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl s 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 10%-

# WINDOW CYCLE
# Alt+Tab — note: this may conflict with OS-level Alt+Tab on some setups.
# If you use KDE/GNOME compatibility layers, rebind to $mainMod,grave instead.
bind = ALT, Tab, cyclenext
