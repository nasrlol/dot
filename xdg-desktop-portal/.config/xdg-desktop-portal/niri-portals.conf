# Overrides /usr/share/xdg-desktop-portal/niri-portals.conf.
# gnome for screencast/screenshot (niri implements its API), gtk for the rest:
# the gnome file chooser needs nautilus, which isn't installed.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.FileChooser=gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Settings=gtk;
