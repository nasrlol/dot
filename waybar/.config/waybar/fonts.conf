<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Loaded only by waybar (FONTCONFIG_FILE in niri's spawn-at-startup).
     Pango renders emoji through the generic "emoji" family, which the system
     config binds to Noto Color Emoji, so the CSS font list alone can't keep the
     bar monochrome. Reject color fonts and use the outline Noto Emoji instead. -->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <pattern><patelt name="color"><bool>true</bool></patelt></pattern>
    </rejectfont>
  </selectfont>
  <alias binding="strong">
    <family>emoji</family>
    <prefer><family>Noto Emoji</family></prefer>
  </alias>
</fontconfig>
